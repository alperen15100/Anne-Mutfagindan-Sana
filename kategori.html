  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="redesign.css?v=9">
</head>
<body data-page="kategori">
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html">Anne ♡<small>Mutfağından Sana</small></a>
    <nav class="main-nav" id="mainNav">
      <a data-nav="home" href="index.html">Ana Sayfa</a>
      <a data-nav="kategori" href="kategori.html">Tarifler</a>
      <a href="kategori.html?cat=Tatlılar">Tatlılar</a>

      <a data-nav="defterim" href="defterim.html">Defterim</a>
    </nav>
    <label class="header-search" aria-label="Tarif ara">
      <input data-search placeholder="Tarif ara…">
      <span>⌕</span>
    </label>
    <a class="header-heart" href="defterim.html" aria-label="Benim Defterim">♡<b data-fav-count></b></a>
    <button class="menu-btn" id="menuBtn" aria-label="Menüyü aç" aria-expanded="false">☰</button>
  </div>
</header>

<main>
  <section class="archive-hero">
    <div class="container archive-top">
      <div>
        <div class="eyebrow">Tarif Arşivi</div>
        <h1 id="archiveTitle">Tüm Tarifler</h1>
        <p id="archiveSub">Tarifler yükleniyor…</p>
      </div>
      <label class="archive-searchbar">
        <input id="archiveSearch" placeholder="Örn. mercimek, börek, tatlı…">
        <button type="button" onclick="this.previousElementSibling.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}))">Ara</button>
      </label>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="archive-toolbar">
        <div id="categoryPills" class="category-pills"></div>
        <select id="sortSelect" aria-label="Tarifleri sırala">
          <option value="">Önerilen sıralama</option>
          <option value="time">En kısa süre</option>

          <option value="az">A–Z</option>
        </select>
      </div>
      <div id="archiveGrid" class="archive-grid"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <a class="brand" href="index.html">Anne ♡<small>Mutfağından Sana</small></a>
